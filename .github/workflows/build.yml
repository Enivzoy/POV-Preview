name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Stage jar
        run: |
          mkdir -p dist
          cp "$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)" dist/pov-preview-26.2.jar
          ls -l dist

      - name: Upload jar
        uses: actions/upload-artifact@v7.0.2
        with:
          path: dist/pov-preview-26.2.jar
          if-no-files-found: error
          archive: false

      - name: Check if a release is due
        id: release_check
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: |
          last_tag="$(git describe --tags --abbrev=0 --match 'build-*' 2>/dev/null || true)"
          if [ -z "$last_tag" ]; then
            since="$(git rev-list --count HEAD)"
          else
            since="$(git rev-list --count "${last_tag}..HEAD")"
          fi
          total="$(git rev-list --count HEAD)"
          echo "Commits since last release: $since"
          if [ "$since" -ge 2 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "tag=build-${total}" >> "$GITHUB_OUTPUT"
            echo "last_tag=${last_tag}" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.release_check.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release_check.outputs.tag }}"
          last_tag="${{ steps.release_check.outputs.last_tag }}"
          cp dist/pov-preview-26.2.jar "pov-preview-26.2-${tag}.jar"

          if [ -z "$last_tag" ]; then
            range="HEAD"
          else
            range="${last_tag}..HEAD"
          fi
          {
            echo "## Features"
            echo
            git log "$range" --no-merges --pretty=format:'- %s (%h)'
            echo
          } > notes.md
          cat notes.md

          gh release create "$tag" "pov-preview-26.2-${tag}.jar" \
            --target "$GITHUB_SHA" \
            --title "Build ${tag#build-}" \
            --notes-file notes.md
